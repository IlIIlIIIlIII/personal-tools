<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#242424">
  <title>Personal Tools · Ubuntu 디자인 시안</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #242424;
      --surface: #2d2d2d;
      --raised: #373737;
      --line: #414141;
      --text: #f3f2ed;
      --muted: #b8b9b1;
      --accent: #859347;
      --accent-light: #c7d695;
      --accent-surface: #424a2d;
      --radius: 12px;
      font-family: "Ubuntu Sans", Ubuntu, system-ui, -apple-system, sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html { scrollbar-color: #68695f var(--background); scrollbar-width: thin; }
    body { margin: 0; background: var(--background); color: var(--text); font-size: 15px; line-height: 1.5; }
    ::selection { background: var(--accent); color: #11150c; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: .35; cursor: default; }
    button, a { touch-action: manipulation; }
    a { color: var(--accent-light); text-underline-offset: 4px; }
    :focus-visible { outline: 2px solid var(--accent-light); outline-offset: 4px; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .skip-link { position: fixed; top: -80px; left: 16px; z-index: 5; padding: 12px 16px; border-radius: 8px; background: var(--text); color: var(--background); }
    .skip-link:focus { top: 16px; }
    .layout { min-height: 100dvh; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100dvh; padding: 28px 16px 18px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
    .brand { padding: 0 10px 24px; }
    .brand strong { display: block; font-size: 18px; font-weight: 650; letter-spacing: -.025em; }
    .brand span { display: block; color: var(--muted); margin-top: 3px; font-size: 12px; }
    .screen-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 4px; margin: -4px; }
    .screen-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
    .screen-link { display: grid; grid-template-columns: 23px minmax(0, 1fr); gap: 9px; align-items: center; min-height: 43px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 13px; transition: background-color 120ms ease, color 120ms ease; }
    .screen-link:hover { background: var(--raised); color: var(--text); }
    .screen-link[aria-current="page"] { background: var(--accent-surface); color: var(--text); }
    .screen-number { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .screen-link[aria-current="page"] .screen-number { color: var(--accent-light); }
    .sidebar-note { color: var(--muted); font-size: 12px; line-height: 1.65; padding: 20px 10px 0; margin: 0; }
    main { min-width: 0; padding: 34px clamp(20px, 3vw, 48px) 28px; }
    .workspace { max-width: 1540px; margin: 0 auto; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 25px; }
    .collection-title { margin: 0; color: var(--muted); font-size: 13px; }
    .pager { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .position { min-width: 57px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: transparent; }
    .icon-button:hover:not(:disabled) { background: var(--raised); }
    .intro { padding-bottom: 24px; min-height: 108px; }
    h1 { font-size: clamp(24px, 2.1vw, 34px); line-height: 1.3; letter-spacing: -.035em; font-weight: 600; margin: 0 0 10px; text-wrap: balance; }
    .description { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.75; max-width: 75ch; word-break: keep-all; overflow-wrap: anywhere; }
    .image-area { margin: 0; }
    .image-button { position: relative; display: block; width: 100%; border: 0; padding: 0; background: #1d1d1d; border-radius: var(--radius); overflow: hidden; cursor: zoom-in; }
    .preview { display: block; width: 100%; height: calc(100dvh - 285px); min-height: 240px; object-fit: contain; }
    .zoom-hint { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 8px; background: #242424ec; color: var(--text); font-size: 12px; opacity: 0; transition: opacity 120ms ease; }
    .image-button:hover .zoom-hint, .image-button:focus-visible .zoom-hint { opacity: 1; }
    .image-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding-top: 15px; font-size: 12px; color: var(--muted); }
    .original-link { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; padding: 6px 0; }
    .original-link:hover { text-decoration: underline; }
    .original-link svg { width: 15px; height: 15px; }
    .review-note { margin: 0; }
    .keyboard-note { margin: 27px 0 0; text-align: right; color: var(--muted); font-size: 12px; }
    kbd { font-family: inherit; display: inline-block; min-width: 20px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; margin: 0 2px; text-align: center; }
    .message { padding: 64px 24px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }
    .message p { max-width: 46ch; margin: 0 auto 18px; word-break: keep-all; }
    .text-button { padding: 9px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); }
    .text-button:hover { background: var(--raised); }
    [hidden] { display: none !important; }
    dialog { width: calc(100vw - 40px); height: calc(100dvh - 40px); max-width: none; max-height: none; margin: auto; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: #1d1d1d; color: var(--text); overflow: hidden; }
    dialog::backdrop { background: #101010e8; }
    .lightbox-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 61px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--background); }
    .lightbox-title { margin: 0; font-size: 14px; font-weight: 500; }
    .lightbox-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .lightbox-stage { height: calc(100% - 61px); overflow: auto; display: flex; align-items: flex-start; justify-content: flex-start; }
    .lightbox-image { width: 100%; height: 100%; display: block; object-fit: contain; cursor: zoom-in; }
    .lightbox-stage.actual-size .lightbox-image { width: auto; height: auto; max-width: none; max-height: none; margin: auto; cursor: zoom-out; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 1800px) { main { padding-top: 44px; } .intro { padding-bottom: 32px; } }
    @media (max-width: 950px) {
      .layout { grid-template-columns: 202px minmax(0,1fr); }
      .sidebar { padding-left: 10px; padding-right: 10px; }
      main { padding: 25px 22px; }
      .screen-link { font-size: 12px; gap: 5px; }
      .preview { min-height: 160px; }
    }
    @media (max-width: 680px) {
      .layout { display: block; }
      .sidebar { height: auto; position: static; padding: 20px 16px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 0 4px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .brand strong { font-size: 17px; }
      .brand span { font-size: 12px; }
      .screen-nav { overflow: auto; padding: 4px; }
      .screen-list { display: flex; gap: 5px; width: max-content; }
      .screen-link { display: flex; gap: 7px; padding: 9px 11px; min-height: 42px; white-space: nowrap; }
      .sidebar-note { display: none; }
      main { padding: 22px 16px 30px; }
      .topline { padding-bottom: 20px; }
      .collection-title { font-size: 12px; }
      .intro { min-height: 0; padding-bottom: 22px; }
      .description { font-size: 13px; }
      .preview { height: auto; min-height: 0; }
      .image-meta { align-items: flex-start; flex-direction: column; gap: 6px; }
      .review-note { order: 2; font-size: 12px; }
      .keyboard-note { display: none; }
      .zoom-hint { opacity: 1; right: 8px; bottom: 8px; padding: 6px; }
      .zoom-hint span { display: none; }
      dialog { width: calc(100vw - 16px); height: calc(100dvh - 16px); }
      .lightbox-toolbar { padding: 12px; gap: 12px; }
      .lightbox-title { font-size: 12px; }
      .lightbox-actions { gap: 8px; }
      .lightbox-actions .text-button { font-size: 12px; padding: 8px 10px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>

  <div class="layout">

    </aside>
    <main id="main-content" tabindex="-1">

            <a class="original-link" id="original" href="#" target="_blank" rel="noopener">원본 이미지 <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg><span class="sr-only">새 탭에서 열기</span></a>
          </figcaption>
        </figure>
        <p class="keyboard-note"><kbd>←</kbd><kbd>→</kbd> 화면 이동 · 이미지 선택 시 크게 보기</p>
      </div>
    </main>
  </div>
  <p class="sr-only" id="announcement" aria-live="polite"></p>
  <dialog id="lightbox" aria-labelledby="lightbox-title">
    <div class="lightbox-toolbar">
      <h2 class="lightbox-title" id="lightbox-title">시안 크게 보기</h2>
      <div class="lightbox-actions"><button class="text-button" id="zoom-toggle" type="button" aria-pressed="false">원본 크기</button><button class="icon-button" id="close-lightbox" type="button" aria-label="크게 보기 닫기" title="닫기 (Esc)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    </div>
    <div class="lightbox-stage" id="lightbox-stage"></div>
  </dialog>

  <script>
    (() => {
      'use strict';
      const element = id => document.getElementById(id);
      const list = element('screen-list');
      const preview = document.createElement('img');
      preview.className = 'preview';
      preview.decoding = 'async';
      const expandedImage = document.createElement('img');
      expandedImage.className = 'lightbox-image';
      const dialog = element('lightbox');
      const stage = element('lightbox-stage');
      let screens = [];
      let activeIndex = -1;

      function setMessage(text, canRetry = false) {
        element('message-text').textContent = text;
        element('message').hidden = false;
        element('retry').hidden = !canRetry;
        element('image-area').hidden = true;
      }

      function setZoom(actual) {
        stage.classList.toggle('actual-size', actual);
        element('zoom-toggle').setAttribute('aria-pressed', String(actual));
        element('zoom-toggle').textContent = actual ? '화면에 맞추기' : '원본 크기';
      }

      function showScreen(index, updateHash = true) {
        if (index < 0 || index >= screens.length) return;
        activeIndex = index;
        const screen = screens[index];
        const label = `${index + 1} / ${screens.length}`;
        element('screen-title').textContent = screen.title;
        element('description').textContent = screen.description;
        element('position').textContent = label;
        element('previous').disabled = index === 0;
        element('next').disabled = index === screens.length - 1;
        element('original').href = screen.url;
        element('open-image').setAttribute('aria-label', `${screen.title} 시안 크게 보기`);
        preview.alt = `${screen.title} — Ubuntu Yaru 디자인 시안`;
        element('image-area').hidden = false;
        element('message').hidden = true;
        preview.src = screen.url;
        element('preview-slot').replaceChildren(preview);
        document.title = `${screen.title} · Personal Tools 디자인 시안`;
        for (const link of list.querySelectorAll('a')) {
          if (link.dataset.id === screen.id) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        }
        const currentLink = list.querySelector('[aria-current="page"]');
        currentLink?.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: 'instant'});
        if (updateHash) history.replaceState(null, '', `#${encodeURIComponent(screen.id)}`);
        element('announcement').textContent = `${label}. ${screen.title}`;
        if (dialog.open) {
          element('lightbox-title').textContent = screen.title;
          expandedImage.src = screen.url;
          expandedImage.alt = preview.alt;
          setZoom(false);
        }
        for (const adjacent of [screens[index - 1], screens[index + 1]]) {
          if (adjacent) { const image = new Image(); image.src = adjacent.url; }
        }
      }

      function indexFromHash() {
        try { return screens.findIndex(screen => screen.id === decodeURIComponent(location.hash.slice(1))); }
        catch { return -1; }
      }

      async function loadManifest() {
        setMessage('디자인 시안을 불러오고 있습니다.');
        try {
          let manifest;
          if (location.protocol === 'file:') {
            manifest = JSON.parse(element('embedded-manifest').textContent);
          } else {
            const response = await fetch('manifest.json', {cache: 'no-store'});
            if (!response.ok) throw new Error('manifest unavailable');
            manifest = await response.json();
          }
          if (!Array.isArray(manifest) || !manifest.length) throw new Error('manifest empty');
          const ids = new Set();
          screens = manifest.map(item => {
            if (!item || typeof item.id !== 'string' || !item.id || ids.has(item.id) || typeof item.title !== 'string' || typeof item.file !== 'string') throw new Error('invalid screen');
            const url = new URL(item.file, location.href);
            if (url.origin !== location.origin || !item.file.startsWith('images/') || /(^|\/)\.\.(\/|$)/.test(item.file)) throw new Error('invalid image');
            ids.add(item.id);
            return {...item, description: typeof item.description === 'string' ? item.description : '', url: url.href};
          });
          list.replaceChildren();
          screens.forEach((screen, index) => {
            const item = document.createElement('li');
            const link = document.createElement('a');
            const number = document.createElement('span');
            const title = document.createElement('span');
            link.className = 'screen-link';
            link.href = `#${encodeURIComponent(screen.id)}`;
            link.dataset.id = screen.id;
            number.className = 'screen-number';
            number.textContent = String(index + 1).padStart(2, '0');
            number.setAttribute('aria-hidden', 'true');
            title.textContent = screen.title;
            link.append(number, title);
            link.addEventListener('click', event => { event.preventDefault(); showScreen(index); });
            item.append(link);
            list.append(item);
          });
          const requested = indexFromHash();
          const shortcut = screens.findIndex(screen => screen.id.includes('shortcut'));
          showScreen(requested >= 0 ? requested : shortcut >= 0 ? shortcut : 0);
        } catch {
          element('screen-title').textContent = '시안을 불러오지 못했어요';
          element('description').textContent = '잠시 후 다시 불러오거나, 공유받은 갤러리 주소로 열어 주세요.';
          element('previous').disabled = true;
          element('next').disabled = true;
          setMessage('화면 목록을 확인할 수 없습니다. 로컬 파일로 열었다면 웹 미리보기 주소를 사용해 주세요.', true);
        }
      }

      preview.addEventListener('error', () => {
        if (activeIndex >= 0) setMessage('이 시안의 이미지를 불러오지 못했어요. 다시 불러오거나 다른 화면을 선택해 주세요.', true);
      });
      element('previous').addEventListener('click', () => showScreen(activeIndex - 1));
      element('next').addEventListener('click', () => showScreen(activeIndex + 1));
      element('retry').addEventListener('click', loadManifest);
      element('open-image').addEventListener('click', () => {
        if (activeIndex < 0) return;
        const screen = screens[activeIndex];
        element('lightbox-title').textContent = screen.title;
        expandedImage.src = screen.url;
        expandedImage.alt = preview.alt;
        stage.replaceChildren(expandedImage);
        setZoom(false);
        dialog.showModal();
        element('close-lightbox').focus();
      });
      element('close-lightbox').addEventListener('click', () => dialog.close());
      element('zoom-toggle').addEventListener('click', () => setZoom(!stage.classList.contains('actual-size')));
      expandedImage.addEventListener('click', () => setZoom(!stage.classList.contains('actual-size')));
      dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
      window.addEventListener('hashchange', () => { const index = indexFromHash(); if (index >= 0) showScreen(index, false); });
      window.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.matches('input, textarea, select, [contenteditable="true"]')) return;
        if (dialog.open && stage.classList.contains('actual-size')) return;
        if (event.key === 'ArrowLeft') { event.preventDefault(); showScreen(activeIndex - 1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); showScreen(activeIndex + 1); }
      });
      loadManifest();
    })();
  </script>
</body>
</html>
